  label_gk_people_name_chat_exposure_forced: "Forced (everyone's link is shown)"
  text_gk_people_name_chat_exposure: "Whether a person's chat link (Teams, Slack) is shown after the name to others. Whether the icons are shown at all is the appearance setting The chat program's icon after the name under Administration, Appearance; when it is optional, the viewer may switch the icons off for herself under My account."
  label_gk_people_settings_name_chat: "Chat links after names"
  label_gk_people_appearance_name_chat: "The chat program's icon after the name"
  text_gk_people_appearance_name_chat: "The Teams or Slack icon after a person's name opens the chat with a link to the page. Shown for persons with an identifier in a scheme marked Icon after the name (GK People)."
  text_gk_people_chat_in: "Chat with %{name} in %{app}"
  text_gk_people_chat_copied: "Copied: link. Paste it in %{app}."
