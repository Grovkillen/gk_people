    one: "1 account got a person."
    other: "%{count} accounts got a person."
  error_gk_people_no_name: "The person needs a name: first name, last name or display name."
  error_gk_people_not_an_account: "That is not a user account."
  error_gk_people_account_taken: "The account already belongs to %{name}. Unlink it there first."
  text_gk_people_unlinked_accounts:
    one: "1 account has no person."
    other: "%{count} accounts have no person."
  text_gk_people_search_persons: "name, organization, e-mail, number"
  text_gk_people_search_orgs: "name or registration number"
  text_gk_people_no_account: "The person has no account. None is needed to be here."
  text_gk_people_account_without_person: "The account does not belong to any person yet."
  text_gk_people_hidden_person: "a person you may not see"
  text_gk_people_unlink_question: "Do you want to unlink the account from the person?"
  text_gk_people_unlink_confirm: "The person and the account both stay, and the account can be linked to a person again."
  text_gk_people_end_confirm: "End the identifier? It stops being valid today and stays in the history."
  text_gk_people_value_placeholder: "type or scan"
  text_gk_people_token_hint: "A badge or code is scanned straight into the field. It is never kept in clear text, only so that it can be recognized."
  text_gk_people_no_schemes: "There are no kinds of identifiers yet. Set them up under Administration."
  text_gk_people_until: "to"
  text_gk_people_display_name: "Leave empty for first and last name."
  text_gk_people_languages: "Languages the person reads besides the account's, separated by commas."
  text_gk_people_notes_warning: "Free text. Never write anything sensitive here (health, judgements of the person)."
  text_gk_people_owned_by_source: "Owned by %{source} and changed there."
  text_gk_people_country: "Two letters, for example SE."
  text_gk_people_approval_by_hand: "Set by hand. Who and when follow the status."
  text_gk_people_schemes_intro: "The kinds of identifiers a person can have: e-mail, telephone, employee number, badge. Data, not code. A kind in use is switched off, never deleted. The names are translated under Translations."
  text_gk_people_key: "Lower case letters, digits and underscore. Set once."
  text_gk_people_scheme_kinds: "Contact reaches the person, reference matches her at a sync, badge or code identifies her at input. Set once."
  text_gk_people_unique: "The same value may belong to one person only."
  text_gk_people_format: "A regular expression the whole value must match, for example [0-9]{4}. Empty means anything."
  text_gk_people_link_template: "Contact only. {value} is the identifier, {title} and {url} the page one is on, {message} both as a ready message. Examples: mailto:{value}, tel:{value}. Chat programs with Icon after the name: Teams https://teams.microsoft.com/l/chat/0/0?users={value}&message={message} (icon brand-teams), Slack https://app.slack.com/client/TEAM-ID/{value} with the member ID as identifier (icon brand-slack; Slack does not take the page along, so its address is copied)."
  text_gk_people_create_person_on_user: "A new account gets a person of the type Internal, or is linked to an existing person without an account."
  text_gk_people_match_by_email: "A new account is linked to the person without an account who has the same e-mail, when there is exactly one."
  label_gk_people_event_subject_access_made: "Subject access extract made"
  label_gk_people_processing: "Personal data"
  text_gk_people_processing_intro: "The record of processing: every table in the instance that holds a person or an account, with purpose, legal basis, retention and who sees the data. The tables are found in the database, so a new table shows up here by itself. The texts come from the plugin that owns the table and can be written over per table. The translations are made under Translations."
  text_gk_people_processing_missing:
    one: "1 table has no purpose. A table with personal data and no purpose is an error."
    other: "%{count} tables have no purpose. A table with personal data and no purpose is an error."
  text_gk_people_processing_complete: "Every table with personal data has a purpose."
  text_gk_people_processing_no_ops: "Instance actions (indexes and other changes the administrator made to a table) are not kept here."
  label_gk_people_pp_table: "Table and columns"
  label_gk_people_pp_owner: "Owned by"
  label_gk_people_pp_purpose: "Purpose"
  label_gk_people_pp_basis: "Legal basis"
  label_gk_people_pp_retention: "Retention"
  label_gk_people_pp_visible: "Who sees the data"
  label_gk_people_pp_written: "written here"
  label_gk_people_pp_declared: "As the plugin says"
  text_gk_people_pp_no_purpose: "No purpose"
  text_gk_people_pp_value_ref: "values pointing to an account"
  text_gk_people_pp_edit_hint: "An empty field shows what the plugin says (grey in the field). Write only what differs for this organization."
  label_gk_people_basis_contract: "Contract"
  label_gk_people_basis_legal_obligation: "Legal obligation"
  label_gk_people_basis_legitimate_interests: "Legitimate interests"
  label_gk_people_basis_consent: "Consent"
  label_gk_people_basis_public_task: "Public task"
  label_gk_people_basis_vital_interests: "Vital interests"
  text_gk_people_pp_account_purpose: "Account, sign-in, permissions and preferences, so that the person can work in the system."
  text_gk_people_pp_account_retention: "As long as the account exists. Accounts are not deleted, they are locked."
  text_gk_people_pp_account_visible: "Administrators and the person herself; the name is seen by those who share projects with her."
  text_gk_people_pp_work_purpose: "Issues, time, documents and history: who did what and when (traceability)."
  text_gk_people_pp_work_retention: "Follows the project. The history is not deleted."
  text_gk_people_pp_work_visible: "Those who see the project, by their roles."
  text_gk_people_pp_people_purpose: "The register of people: who the person is, where she belongs and how she is reached and recognized. Quick contacts are included: a person or an organization registered with only what was known on the spot (often a first name, a role and an organization), with the line as written in the event that created it, until it is completed or merged with an existing one."
  text_gk_people_pp_people_retention: "As long as the person is current."
  text_gk_people_pp_people_visible: "Those with the permission to see people; the person herself."
  text_gk_people_pp_records_purpose: "Notes, events, links and assessments with who wrote them and when (traceability)."
  text_gk_people_pp_records_retention: "Kept without thinning."
  text_gk_people_pp_records_visible: "Those who see what the post is about."
  label_gk_people_subject_access: "Subject access extract"
  label_gk_people_my_data: "My personal data"
  button_gk_people_print: "Print"
  text_gk_people_sa_made: "Made %{when} by %{by}. The extract is not kept; that it was made is in the person's history."
  text_gk_people_sa_intro: "Everything the system holds about the person, per table and with its purpose, timestamps and history too. Passwords, keys and codes are never shown."
  text_gk_people_sa_correction: "Correction and objection are made as an issue of the type Personal data, not in the extract."
  text_gk_people_sa_summary: "%{tables} tables, %{rows} rows."
  text_gk_people_sa_rows:
    one: "1 row"
    other: "%{count} rows"
  text_gk_people_sa_secret: "hidden"
  text_gk_people_sa_other: "another's"
  text_gk_people_sa_others: "Where the person only did something in data about someone else (added another person's identifier, for example) the extract shows that she did it and when, but not the other person's data; those cells say another's."
  text_gk_people_sa_more: "The latest %{shown} of %{count} rows are shown."
  text_gk_people_sa_counts_only: "The content is shown to the person only. Here are the tables, why they are kept and how many rows concern the person; the person sees the rows in her own extract under My account."
  label_gk_people_sa_mentioned: "Mentioned in"
  text_gk_people_sa_mentioned: "Events about something else that name the person in their details, as a register person or by her account. Only the fields she is named in are shown, not the rest of the event or what it is about."
  label_gk_people_sa_fields: "Named in the fields"
  text_gk_people_sa_no_person: "Your account does not belong to a person yet, so there is no extract to show. Contact the administrator."
  label_gk_people_groups: "Groups"
  label_gk_people_group: "Group"
  label_gk_people_group_new: "New group"
  label_gk_people_members: "Members"
  label_gk_people_add_member: "Add a member"
  button_gk_people_remove_member: "Remove from the group"
  text_gk_people_remove_member_confirm: "Remove %{name} from the group? The person stays, and that she was in it is in the group's history."
  text_gk_people_groups_intro: "Groups of people, with or without an account, for quick picks and mailings: shifts, teams, the management group. They give no permissions; Redmine's groups under Administration do. A group is made inactive, never deleted."
  text_gk_people_group_description: "What the group is for. Translated under Translations, like the name."
  text_gk_people_in_no_group: "In no group."
  notice_gk_people_member_added: "%{name} is in the group."
  notice_gk_people_member_removed: "%{name} is no longer in the group."
  error_gk_people_no_such_person: "The person does not exist."
  label_gk_people_event_person_group_created: "Group created"
  label_gk_people_event_person_group_changed: "Group changed"
  label_gk_people_event_person_group_member_added: "Member added to the group"
  label_gk_people_event_person_group_member_removed: "Member removed from the group"
  label_gk_people_elevation: "Elevation (administrator as a layer)"
  label_gk_people_elevations: "Elevations"
  label_gk_people_step_up: "Step up"
  label_gk_people_step_up_row: "Step up…"
  label_gk_people_see_as_row: "See as…"
  button_gk_people_step_up: "Step up"
  button_gk_people_step_down: "Step down"
  label_gk_people_elevated_ribbon: "Admin"
  text_gk_people_elevated_ribbon_title: "As administrator"
  label_gk_people_reserve_ribbon: "Reserve"
  label_gk_people_reserve_row: "The reserve account"
  text_gk_people_reserve_row: "Signed in with the reserve account"
  label_gk_people_cannot_step_up: "Cannot step up"
  text_gk_people_cannot_step_up_why: "Cannot step up: the account belongs to no person"
  text_gk_people_see_as_menu: "Seeing as %{who}"
  text_gk_people_see_as_stop_who: "Stop seeing as %{who}"
  text_gk_people_elevated_box_extends: "The time is extended to %{minutes} minutes after the last thing you do, at most until %{max}."
  text_gk_people_elevated_box_reason: "Reason: %{reason}"
  label_gk_people_elevation_enabled: "Require stepping up"
  label_gk_people_elevation_minutes: "Minutes without activity"
  label_gk_people_elevation_max_minutes: "At most, in minutes"
  label_gk_people_elevation_reason: "Reason"
  label_gk_people_elevation_from: "From"
  label_gk_people_elevation_to: "To"
  label_gk_people_elevation_how: "Ended"
  label_gk_people_elevation_actions: "Changes"
  label_gk_people_elevation_open: "ongoing"
  label_gk_people_elevation_page: "Page"
  label_gk_people_elevation_method: "Identified with"
  label_gk_people_elevation_method_password: "password"
  label_gk_people_elevation_end_stepped_down: "stepped down"
  label_gk_people_elevation_end_expired: "time ran out"
  label_gk_people_elevation_end_logout: "logged out"
  label_gk_people_elevation_end_revoked: "revoked"
  label_gk_people_elevation_end_gate_opened: "the gate opened"
  label_gk_people_elevation_end_gate_closed: "the gate closed"
  text_gk_people_elevation_settings: "An administrator works as herself and steps up when something needs an administrator: the password again, a reason if she wants, and a time that is extended while she works. What is changed meanwhile is kept with the elevation. Holds only while at least one active administrator account belongs to a person; an administrator account without a person cannot step up then."
  text_gk_people_elevation_minutes: "The elevation falls away when so many minutes pass without anything being done, and after the longest time at the latest."
  text_gk_people_elevation_off: "Stepping up is not required in this instance (the setting in gk_people is off)."
  text_gk_people_elevation_inactive: "Stepping up is not required here at the moment; your account is administrator as usual."
  text_gk_people_elevation_no_person: "Your administrator account belongs to no person, so it cannot step up. Ask another administrator to link the account to a person."
  text_gk_people_step_up_intro: "Enter your password again. The elevation holds for %{minutes} minutes after the last thing you do, at most %{max} minutes, or until you step down. Everything you change meanwhile is done as Administration and kept with the elevation."
  text_gk_people_elevation_reason: "Optional. Shown under Elevations, for example: correcting roles after the reorganization."
  text_gk_people_elevated_until: "Administrator until %{until}"
  text_gk_people_elevations_intro: "Every time an administrator stepped up: who, why, from and to, how it ended and what was changed meanwhile. Never deleted."
  text_gk_people_no_reason: "no reason"
  notice_gk_people_stepped_up: "You are administrator until %{until}."
  notice_gk_people_stepped_down: "You have stepped down."
  notice_gk_people_step_up_first: "Step up first."
  label_gk_people_event_elevation_started: "Stepped up"
  label_gk_people_event_elevation_ended: "Stepped down"
  label_gk_people_event_elevation_failed: "Failed elevation"
  text_gk_people_pp_elevation_purpose: "Traceability of administrative actions: who stepped up, why, when and what was changed."
  text_gk_people_pp_elevation_retention: "No retention; the elevations are the trace of who did what as Administration."
  text_gk_people_pp_elevation_visible: "Administrators while stepped up."
  label_gk_people_earlier_reasons: "Earlier reasons"
  text_gk_people_use_reason: "Use this reason"
  label_gk_people_reserve_accounts: "Reserve accounts"
  text_gk_people_reserve_accounts: "Tick the administrators who are to have a reserve account. The plugin makes it, keeps its password and two-factor equal to those of the account, and locks it when the account is locked or no longer administrator. The reserve account never needs to step up; every session with it is kept as an elevation with what was changed. Elevation does not hold until at least one reserve account exists."
  text_gk_people_elevation_held_switched_off: "Elevation is switched off outside the web (GK_ELEVATION=off, or off first in the file control/elevation.txt beside the instance). Write on in the file to switch it on again."
  text_gk_people_elevation_held_no_reserve: "Elevation does not hold yet: tick at least one administrator who is to have a reserve account, or choose a shared administrator account."
  text_gk_people_elevation_held_no_holder: "Elevation does not hold yet: no active administrator account belongs to a person. Link your account to a person first."
  text_gk_people_elevation_held_error: "Elevation does not hold: something went wrong when the setting was checked. See the log."
  label_gk_people_elevation_method_reserve: "reserve account"
  label_gk_people_event_elevation_reserve_used: "Reserve account used"
  label_gk_people_elevation_method_gate: "Gate closed"
  label_gk_people_event_elevation_gate_open: "Administrator without elevation: GK GUI Stuff not active"
  text_gk_people_reserve_bar: "Reserve account: administrator for as long as the account is signed in. Everything changed is kept under Elevations."
  text_gk_people_elevate_needed: "The page needs you to step up."
