  label_gk_people_reserve_accounts: "Reservkonton"
  text_gk_people_reserve_accounts: "Bocka för de administratörer som ska ha ett reservkonto. Pluginet skapar det, håller lösenordet och tvåfaktorn lika med kontots och låser det när kontot låses eller inte längre är administratör. Reservkontot behöver aldrig stega upp; varje session med det sparas som en upphöjning med det som ändrades. Upphöjning gäller inte förrän minst ett reservkonto finns."
  text_gk_people_elevation_held_switched_off: "Upphöjning är avstängd utanför webben (GK_ELEVATION=off, eller off först i filen control/elevation.txt vid instansen). Skriv on i filen för att slå på den igen."
