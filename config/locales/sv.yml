  text_gk_people_pp_account_purpose: "Konto, inloggning, behörighet och inställningar, så att personen kan arbeta i systemet."
  text_gk_people_pp_account_retention: "Så länge kontot finns. Konton tas inte bort, de låses."
  text_gk_people_pp_account_visible: "Administratörer och personen själv; namnet syns för dem som delar projekt med henne."
  text_gk_people_pp_work_purpose: "Ärenden, tid, dokument och historik: vem gjorde vad och när (spårbarhet)."
  text_gk_people_pp_work_retention: "Följer projektet. Historiken tas inte bort."
  text_gk_people_pp_work_visible: "De som ser projektet, enligt sina roller."
  text_gk_people_pp_people_purpose: "Personregistret: vem personen är, var hon hör hemma och hur hon nås och känns igen. Snabbkontakter ingår: en person eller organisation som registrerats med bara det som var känt på plats (ofta förnamn, roll och organisation), med raden som skrevs i händelsen som skapade den, tills den kompletteras eller slås ihop med en befintlig."
  text_gk_people_pp_people_retention: "Så länge personen är aktuell."
  text_gk_people_pp_people_visible: "De med behörigheten att se personer; personen själv."
  text_gk_people_pp_records_purpose: "Noter, händelser, länkar och bedömningar med vem som skrev och när (spårbarhet)."
  text_gk_people_pp_records_retention: "Sparas utan gallring."
  text_gk_people_pp_records_visible: "De som ser det posten gäller."
