  label_gk_people_settings_actor: "Delade konton"
  text_gk_people_settings_actor: "Ett konto som sitter på en delad dator (packbordet, verkstaden) är delat. Den som skapar eller ändrar ett ärende därifrån anger vem hon är, och ärendet visar \"Registrerad av <person> via <konto>\". Redmines författare ändras inte. Det är inte säkert mot fusk och framställs inte så: det säger vem den vid datorn sa att hon var."
