  text_gk_people_sa_made: "Taget %{when} av %{by}. Utdraget sparas inte; att det togs står i personens historik."
  text_gk_people_sa_intro: "Allt systemet håller om personen, per tabell och med ändamål, även tidsstämplar och historik. Lösenord, nycklar och koder visas aldrig."
  text_gk_people_sa_correction: "Rättelse och invändning görs som ett ärende av typen Personuppgift, inte i utdraget."
  text_gk_people_sa_summary: "%{tables} tabeller, %{rows} rader."
