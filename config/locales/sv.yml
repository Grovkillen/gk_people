  text_gk_people_elevation_settings: "En administratör arbetar som sig själv och stegar upp när något kräver administratör: lösenordet igen, ett skäl om hon vill, och en tid som förlängs medan hon arbetar. Det som ändras under tiden sparas med upphöjningen. Gäller bara när minst ett aktivt administratörskonto hör till en person; ett administratörskonto utan person kan då inte stega upp."
  text_gk_people_elevation_minutes: "Upphöjningen faller av när så många minuter gått utan att något görs, och senast efter den längsta tiden."
  text_gk_people_elevation_off: "Upphöjning krävs inte i den här instansen (inställningen i gk_people är av)."
  text_gk_people_elevation_inactive: "Upphöjning krävs inte här just nu; ditt konto är administratör som vanligt."
  text_gk_people_elevation_no_person: "Ditt administratörskonto hör inte till någon person, så det kan inte stega upp. Be en annan administratör koppla kontot till en person."
  text_gk_people_step_up_intro: "Ange ditt lösenord igen. Upphöjningen gäller i %{minutes} minuter efter det senaste du gör, högst %{max} minuter, eller tills du stegar ner. Allt du ändrar under tiden görs som Administration och sparas med upphöjningen."
