    one: "1 rad"
    other: "%{count} rader"
  text_gk_people_sa_secret: "dold"
  text_gk_people_sa_other: "annans"
  text_gk_people_sa_others: "Där personen bara gjorde något i en uppgift om någon annan (till exempel lade in en annan persons identifierare) visas att hon gjorde det och när, men inte den andras uppgifter; de cellerna säger annans."
  text_gk_people_sa_more: "De %{shown} senaste av %{count} rader visas."
  text_gk_people_sa_counts_only: "Innehållet visas bara för personen själv. Här står tabellerna, varför de finns och hur många rader som gäller personen; personen ser raderna i sitt eget utdrag under Mitt konto."
  label_gk_people_sa_mentioned: "Nämnd i"
  text_gk_people_sa_mentioned: "Händelser om något annat där personen nämns i detaljerna, som registerperson eller genom sitt konto. Bara i vilka fält hon nämns visas, inte resten av händelsen eller vad den gäller."
  label_gk_people_sa_fields: "Nämnd i fälten"
  text_gk_people_sa_no_person: "Ditt konto hör inte till någon person än, så det finns inget utdrag att visa. Kontakta administratören."
