  text_gk_people_schemes_intro: "Vilka slag av identifierare en person kan ha: e-post, telefon, anställningsnummer, bricka. Det är data, inte kod. Ett slag som används stängs av, det tas aldrig bort. Namnen översätts under Översättningar."
  text_gk_people_key: "Små bokstäver, siffror och understreck. Sätts en gång."
  text_gk_people_scheme_kinds: "Kontakt når personen, referens matchar henne vid synk, bricka eller kod identifierar henne vid inmatning. Sätts en gång."
  text_gk_people_unique: "Samma värde får bara finnas hos en person."
  text_gk_people_format: "Ett reguljärt uttryck som hela värdet ska stämma mot, till exempel [0-9]{4}. Tomt betyder vad som helst."
  text_gk_people_link_template: "Bara för kontakt. {value} är identifieraren, {title} och {url} sidan man står på, {message} båda som färdigt meddelande. Exempel: mailto:{value}, tel:{value}. Chattprogram med Ikon efter namnet: Teams https://teams.microsoft.com/l/chat/0/0?users={value}&message={message} (ikon brand-teams), Slack https://app.slack.com/client/TEAM-ID/{value} med medlems-id som identifierare (ikon brand-slack; Slack tar inte med sidan, så adressen kopieras)."
  text_gk_people_create_person_on_user: "Ett nytt konto får en person av typen Intern, eller kopplas till en befintlig person utan konto."
  text_gk_people_match_by_email: "Ett nytt konto kopplas till den person utan konto som har samma e-post, när det finns exakt en."
  label_gk_people_event_subject_access_made: "Registerutdrag taget"
  label_gk_people_processing: "Personuppgifter"
  text_gk_people_processing_intro: "Registerförteckningen: varje tabell i instansen som håller en person eller ett konto, med ändamål, rättslig grund, gallring och vilka som ser uppgifterna. Tabellerna hittas i databasen, så en ny tabell syns här av sig själv. Texterna kommer från pluginen som äger tabellen och kan skrivas över per tabell. Översättningarna görs under Översättningar."
  text_gk_people_processing_missing:
    one: "1 tabell saknar ändamål. En tabell med personuppgifter utan ändamål är ett fel."
    other: "%{count} tabeller saknar ändamål. En tabell med personuppgifter utan ändamål är ett fel."
  text_gk_people_processing_complete: "Varje tabell med personuppgifter har ett ändamål."
  text_gk_people_processing_no_ops: "Instanshandlingar (index och andra ändringar som administratören gjort på en tabell) förs inte här."
